[project]
name = "mcarchive-api"
version = "0.1.1"
description = "Unofficial library to help you consume the MCArchive API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "红温的鼠鼠7891", email = "pystart@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "httpx>=0.28.1",
    "urllib3>=2.8.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
keywords = ["minecraft", "http", "api", "json"]

[project.urls]
Homepage = "https://angrymouse7891.github.io/mcarchive-api-python/"
Documentation = "https://angrymouse7891.github.io/mcarchive-api-python/en/changelog/"
Repository = "https://github.com/AngryMouse7891/mcarchive-api-python.git"
Issues = "https://github.com/AngryMouse7891/mcarchive-api-python/issues"
Changelog = "https://angrymouse7891.github.io/mcarchive-api-python/en/changelog/"

[project.scripts]
mcarchive-api = "mcarchive_api:main"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-git-authors-plugin>=0.10.0",
    "mkdocs-git-revision-date-localized-plugin>=1.7.0",
    "mkdocs-material>=9.8.1",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocstrings[python]>=1.0.8",
]
